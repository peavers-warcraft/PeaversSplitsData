name: Release

on:
  # ##########################################################################
  # #  CRON DISARMED ON PURPOSE - RE-ARM ONCE THE CURSEFORGE PROJECT EXISTS #
  # ##########################################################################
  #
  # The scheduled trigger below is commented out because this addon has no
  # CurseForge project yet, so there is no X-Curse-Project-ID in the TOC.
  #
  # The shared release workflow has NO new-commit gate: every run bumps the
  # version, commits, tags and cuts a GitHub release BEFORE it reaches the
  # CurseForge upload step. With no project id that upload fails, the job goes
  # red and the Discord failure webhook fires - so a 6-hourly cron would
  # manufacture four junk tags, four junk releases and four false alarms per
  # day, forever, with nothing having changed.
  #
  # TO RE-ARM: create the CurseForge project, add `## X-Curse-Project-ID: <id>`
  # to PeaversSplitsData.toc and set `curseForgeProjectId:` in
  # .peavers.yml, then uncomment the two lines below. Until then, cut releases
  # by hand with workflow_dispatch (Actions -> Release -> Run workflow).
  #
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  release:
    uses: peavers-code/peavers-warcraft-workflows/.github/workflows/release.yml@master
    with:
      toc_file: PeaversSplitsData.toc
      addon_name: PeaversSplitsData
      git_user_name: Chris Turner
      git_user_email: peavers@gmail.com
      use_self_hosted: true
    secrets: inherit
